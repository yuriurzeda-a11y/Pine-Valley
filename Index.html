/* ---------- textura pixel art simples (nearest filter) ---------- */
function makePixelTexture(baseColor, accentColor, size, repeat) {
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = baseColor; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = accentColor;
  for (let i = 0; i < size; i++) for (let j = 0; j < size; j++) {
    if ((i + j) % 3 === 0) ctx.fillRect(i, j, 1, 1);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  return tex;
}

function boxMesh(w, h, d, color) {
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
}
function makeTextSprite(text, opts = {}) {
  const { fontsize = 64, color = "#ffffff", bg = "rgba(0,0,0,0.55)", scale = 3, pad = 20 } = opts;
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  ctx.font = `bold ${fontsize}px sans-serif`;
  const metrics = ctx.measureText(text);
  canvas.width = Math.ceil(metrics.width) + pad * 2;
  canvas.height = fontsize + pad * 2;
  ctx.font = `bold ${fontsize}px sans-serif`;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = color; ctx.textBaseline = "middle"; ctx.textAlign = "center";
  ctx.fillText(text, canvas.width / 2, canvas.height / 2 + 2);
  const tex = new THREE.CanvasTexture(canvas); tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: true, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  const aspect = canvas.width / canvas.height;
  sprite.scale.set(scale * aspect, scale, 1);
  sprite.userData.canvas = canvas; sprite.userData.ctx = ctx; sprite.userData.opts = opts;
  return sprite;
}
function updateTextSprite(sprite, text) {
  const { fontsize = 64, color = "#ffffff", bg = "rgba(0,0,0,0.55)" } = sprite.userData.opts;
  const canvas = sprite.userData.canvas, ctx = sprite.userData.ctx;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = bg; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = color; ctx.textBaseline="middle"; ctx.textAlign="center";
  ctx.font = `bold ${fontsize}px sans-serif`;
  ctx.fillText(text, canvas.width/2, canvas.height/2 + 2);
  sprite.material.map.needsUpdate = true;
}

let ptVoice = null;
function loadPtVoice() {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  ptVoice = voices.find(v => v.lang === "pt-BR")
    || voices.find(v => v.lang && v.lang.toLowerCase().startsWith("pt"))
    || null;
}
if ("speechSynthesis" in window) {
  loadPtVoice();
  window.speechSynthesis.onvoiceschanged = loadPtVoice;
}
function speak(text, opts = {}) {
  try {
    if (!("speechSynthesis" in window)) return;
    if (!ptVoice) loadPtVoice(); // tenta de novo caso as vozes só tenham carregado agora
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "pt-BR";
    if (ptVoice) u.voice = ptVoice;
    u.pitch = opts.pitch || 1;
    u.rate = opts.rate || 0.95;
    window.speechSynthesis.speak(u);
  } catch (err) { console.error("Erro de voz:", err); }
}
/* ---------- barulinho "pi pi pi" (Web Audio, sem precisar de arquivo) ---------- */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (err) { audioCtx = null; }
  }
  return audioCtx;
}
function playBlip(freq) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.value = 0.06;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.stop(ctx.currentTime + 0.06);
  } catch (err) { console.error("Erro no blip:", err); }
}

function say(speaker, text, voiceOpts) {
  const el = document.getElementById("subtitle");
  el.style.display = "block";
  clearTimeout(say._h);
  clearInterval(say._typeInterval);
  const prefix = `<b>${speaker}:</b> `;

  // texto aparecendo aos poucos com "pi pi pi"
  const baseFreq = (voiceOpts && voiceOpts.pitch ? voiceOpts.pitch : 1) * 420;
  let i = 0;
  el.innerHTML = prefix;
  say._typeInterval = setInterval(() => {
    i++;
    el.innerHTML = prefix + text.slice(0, i);
    const ch = text[i - 1];
    if (ch && ch !== " " && i % 2 === 0) playBlip(baseFreq + Math.random() * 160);
    if (i >= text.length) {
      clearInterval(say._typeInterval);
      say._h = setTimeout(() => el.style.display = "none", 1800);
    }
  }, 35);
}

function updatePedestrians(delta) {
  for (const p of pedestrians) {
    if (p.knockElapsed === undefined) p.knockElapsed = Infinity;
    if (p.knockElapsed < KNOCKDOWN_DURATION) {
      p.knockElapsed += delta;
      p.visual.rotation.x = knockdownAngle(p.knockElapsed, KNOCKDOWN_DURATION);
      p.visual.position.y = 0;
      continue;
    } else if (p.visual.rotation.x !== 0) {
      p.visual.rotation.x = 0;
    }
    if (p.paused) { p.visual.position.y = 0; continue; }
    p.t += p.dir * delta * p.speed;
    if (p.t >= 1) { p.t = 1; p.dir = -1; }
    if (p.t <= 0) { p.t = 0; p.dir = 1; }
    p.mesh.position.lerpVectors(p.a, p.b, p.t);
    const target = p.dir > 0 ? p.b : p.a;
    if (Math.abs(target.x - p.mesh.position.x) > 0.05 || Math.abs(target.z - p.mesh.position.z) > 0.05) {
      p.mesh.lookAt(target.x, 0, target.z);
    }
    p.walkPhase += delta * 10;
    p.visual.position.y = Math.abs(Math.sin(p.walkPhase)) * 0.32;
  }
}

/* ---------- cutscene de abertura: chegando de carro na cidade ---------- */
const INTRO_PATH = [
  { x: -46, z: 60 }, // vindo de fora da cidade
  { x: -46, z: 9 },  // entra pelo anel do perímetro (borda esquerda) até a altura da rua principal
  { x: -24, z: 9 },  // pega a rua principal até a altura de casa
  { x: -24, z: 4 },  // entra na "garagem" de casa
];
function introPathLength(path) {
  let total = 0;
  for (let i = 0; i < path.length - 1; i++) total += Math.hypot(path[i+1].x - path[i].x, path[i+1].z - path[i].z);
  return total;
}
const INTRO_TOTAL_LEN = introPathLength(INTRO_PATH);
function getIntroPoint(t) {
  let dist = t * INTRO_TOTAL_LEN;
  for (let i = 0; i < INTRO_PATH.length - 1; i++) {
    const a = INTRO_PATH[i], b = INTRO_PATH[i+1];
    const segLen = Math.hypot(b.x - a.x, b.z - a.z);
    if (dist <= segLen || i === INTRO_PATH.length - 2) {
      const segT = segLen > 0 ? Math.min(1, dist / segLen) : 1;
      return { x: a.x + (b.x - a.x) * segT, z: a.z + (b.z - a.z) * segT, dirX: b.x - a.x, dirZ: b.z - a.z };
    }
    dist -= segLen;
  }
  const last = INTRO_PATH[INTRO_PATH.length - 1];
  return { x: last.x, z: last.z, dirX: 0, dirZ: -1 };
}
function startIntro() {
  introCar = buildCarMesh(0xef6c6c);
  const p0 = INTRO_PATH[0];
  introCar.position.set(p0.x, 0, p0.z);
  scene.add(introCar);
  player.visible = false;
}
function updateIntro(delta) {
  introT += delta;
  const t = Math.min(1, introT / INTRO_DURATION);
  const eased = t * t * (3 - 2 * t); // suaviza início/fim
  const pos = getIntroPoint(eased);
  introCar.position.set(pos.x, 0, pos.z);
  const dirLen = Math.hypot(pos.dirX, pos.dirZ) || 1;
  const ndx = pos.dirX / dirLen, ndz = pos.dirZ / dirLen;
  if (dirLen > 0.001) introCar.lookAt(pos.x + ndx, 0, pos.z + ndz);
  thirdCam.position.set(pos.x - ndx * 8, 4.5, pos.z - ndz * 8);
  thirdCam.lookAt(pos.x, 1, pos.z);
  activeCamera = thirdCam;
  renderer.render(scene, activeCamera);
  if (t >= 1) endIntro();
}
function endIntro() {

function carShouldBrake(carPos, dirNorm) {
  const targets = [player.position, ...pedestrians.map(p => p.mesh.position)];
  for (const t of targets) {
    const toT = new THREE.Vector3(t.x - carPos.x, 0, t.z - carPos.z);
    const forwardDist = toT.dot(dirNorm);
    if (forwardDist <= 0 || forwardDist > 6) continue;
    const lateral = Math.sqrt(Math.max(0, toT.lengthSq() - forwardDist * forwardDist));
    if (lateral < 1.8) return true;
  }
  return false;
}
function updateCars(delta) {
  for (const c of cars) {
    if (c.type === "loop") {
      const a0 = CAR_LOOP[c.wp], b0 = CAR_LOOP[(c.wp + 1) % CAR_LOOP.length];
      const dirNorm = new THREE.Vector3(b0.x - a0.x, 0, b0.z - a0.z).normalize();
      if (!carShouldBrake(c.mesh.position, dirNorm)) {
        c.t += delta * c.speed;
        if (c.t >= 1) { c.t -= 1; c.wp = (c.wp + 1) % CAR_LOOP.length; }
      }
      const a = CAR_LOOP[c.wp], b = CAR_LOOP[(c.wp + 1) % CAR_LOOP.length];
      const av = new THREE.Vector3(a.x,0,a.z), bv = new THREE.Vector3(b.x,0,b.z);
      c.mesh.position.lerpVectors(av, bv, c.t);
      const dir = bv.clone().sub(av); // direção fixa do trecho (nunca chega a zero perto da curva)
      c.mesh.lookAt(c.mesh.position.x + dir.x, c.mesh.position.y, c.mesh.position.z + dir.z);
    } else {
      const dirNorm0 = (c.dir > 0 ? c.b.clone().sub(c.a) : c.a.clone().sub(c.b)).normalize();
      if (!carShouldBrake(c.mesh.position, dirNorm0)) {
        c.t += c.dir * delta * c.speed;
        if (c.t >= 1) { c.t = 1; c.dir = -1; }
        if (c.t <= 0) { c.t = 0; c.dir = 1; }
      }
      c.mesh.position.lerpVectors(c.a, c.b, c.t);
      const fixedDir = c.dir > 0 ? c.b.clone().sub(c.a) : c.a.clone().sub(c.b); // direção fixa (evita instabilidade nas pontas)
      c.mesh.lookAt(c.mesh.position.x + fixedDir.x, c.mesh.position.y, c.mesh.position.z + fixedDir.z);
    }
  }
}

const PEDESTRIAN_HIT_LINES = ["Ai! Cuidado por onde anda!", "Ei! Quase fui atropelado!", "Nossa, que susto!"];
const KNOCKDOWN_DURATION = 1.6;
function knockdownAngle(elapsed, duration) {
  const p = Math.min(1, elapsed / duration);
  if (p < 0.25) return (p / 0.25) * (Math.PI / 2.1);       // cai
  if (p < 0.7) return Math.PI / 2.1;                        // fica caído
  return (1 - (p - 0.7) / 0.3) * (Math.PI / 2.1);           // levanta
}
function updateCarCollisions(delta) {
  if (playerHitCooldown > 0) playerHitCooldown -= delta;
  for (const p of pedestrians) {
    if (p.hitCooldown > 0) p.hitCooldown -= delta;
  }
  for (const c of cars) {
    const cp = c.mesh.position;
    if (playerHitCooldown <= 0) {
      const dPlayer = Math.hypot(cp.x - player.position.x, cp.z - player.position.z);
      if (dPlayer < 1.8) {
        hitPlayerByCar(c);
        playerHitCooldown = 2.5;
      }
    }
    for (const p of pedestrians) {
      if (p.hitCooldown > 0) continue;
      const dPed = Math.hypot(cp.x - p.mesh.position.x, cp.z - p.mesh.position.z);
      if (dPed < 1.6) {
        p.paused = true;
        p.hitCooldown = 3.5;
        p.knockElapsed = 0;
        say("Pedestre", PEDESTRIAN_HIT_LINES[Math.floor(Math.random()*PEDESTRIAN_HIT_LINES.length)], { pitch: 1.2, rate: 1.1 });
        setTimeout(() => { p.paused = false; }, 3200);
      }
    }
  }
}
function hitPlayerByCar(car) {
  const away = new THREE.Vector3(player.position.x - car.mesh.position.x, 0, player.position.z - car.mesh.position.z);
  if (away.lengthSq() > 0.0001) {
    away.normalize();
    player.position.x += away.x * 2.2;
    player.position.z += away.z * 2.2;
  }
  state.saude = Math.max(0, state.saude - 45);
  refreshHUD();
  say("Você", "Um carro me atropelou!", { pitch: 1.0, rate: 1.05 });

}

let aspect = W / H;
const firstCam = new THREE.PerspectiveCamera(70, aspect, 0.1, 300);
const thirdCam = new THREE.PerspectiveCamera(68, aspect, 0.1, 300);
let camMode = "third";
let activeCamera = thirdCam;
let activeMinigameFocus = null;
let activeMinigameCamDist = 9;
let cameraYaw = 0, cameraPitch = 0;
let isDragging = false, lastMouseX = 0, lastMouseY = 0;

function handleResize() {
  W = wrap.clientWidth || W; H = wrap.clientHeight || H;
  if (W < 10 || H < 10) return;
  aspect = W / H;
  firstCam.aspect = aspect; firstCam.updateProjectionMatrix();
  thirdCam.aspect = aspect; thirdCam.updateProjectionMatrix();
  renderer.setSize(W, H);
}
window.addEventListener("resize", handleResize);
window.addEventListener("orientationchange", () => setTimeout(handleResize, 200));
if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
  document.body.classList.add("touch-device");
}

function facingVector(yaw, pitch) {
  return new THREE.Vector3(
    Math.sin(yaw) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw) * Math.cos(pitch)
  );
}

function updateCameras() {
  if (minigameMode && activeMinigameFocus) {
    const f = activeMinigameFocus;
    const d = activeMinigameCamDist || 9;
    const fy = f.y !== undefined ? f.y : 1.6;
    thirdCam.position.set(f.x + d, d*1.1, f.z + d);
    thirdCam.lookAt(f.x, fy, f.z);
    activeCamera = thirdCam;
    return;
  }
  const p = player.position;
  const facing = facingVector(cameraYaw, cameraPitch);
  if (camMode === "first") {
    firstCam.position.set(p.x, p.y + 2.0, p.z);
    firstCam.lookAt(p.x + facing.x, p.y + 2.0 + facing.y, p.z + facing.z);
    activeCamera = firstCam;
  } else {
    const dist = currentArea === "town" ? 10 : 4.3;
    const eyeHeight = 1.85;
    const target = new THREE.Vector3(p.x, p.y + eyeHeight, p.z);
    thirdCam.position.set(target.x - facing.x * dist, target.y - facing.y * dist, target.z - facing.z * dist);
    thirdCam.lookAt(target);
    activeCamera = thirdCam;
  }
}

const keys = {};

function rectHitTown(px, pz, b) {
  return Math.abs(px - b.x) < (b.w/2 + 0.9) && Math.abs(pz - b.z) < (b.d/2 + 0.9);
}

function updatePlayer(delta) {
  if (modalOpen || minigameMode) return;

  // física do pulo
  if (player.position.y > 0 || playerVelocityY > 0) {
    playerVelocityY -= GRAVITY * delta;
    player.position.y += playerVelocityY * delta;
    if (player.position.y <= 0) { player.position.y = 0; playerVelocityY = 0; }
  }

  const knockedDown = playerKnockElapsed < KNOCKDOWN_DURATION;
  let dx = 0, dz = 0;
  if (!knockedDown) {
    if (keys["arrowup"] || keys["w"]) dz -= 1;
    if (keys["arrowdown"] || keys["s"]) dz += 1;
    if (keys["arrowleft"] || keys["a"]) dx -= 1;
    if (keys["arrowright"] || keys["d"]) dx += 1;
    dx += joystickVec.x;
    dz += joystickVec.y;
  }

  if (dx !== 0 || dz !== 0) {
    const len = Math.hypot(dx, dz);
    dx /= len; dz /= len;

    // movimento relativo à direção que a câmera está olhando
    const forward = facingVector(cameraYaw, 0);
    const right = forward.clone().applyAxisAngle(new THREE.Vector3(0,1,0), -Math.PI/2);
    const moveDir = new THREE.Vector3()
      .addScaledVector(forward, -dz)
      .addScaledVector(right, dx);
    if (moveDir.lengthSq() > 0.0001) moveDir.normalize();

    const running = (keys["shift"] || touchRunning) && !knockedDown;
    const speed = (running ? BASE_SPEED * RUN_MULTIPLIER : BASE_SPEED) * delta;
    if (running) state.fome = Math.max(0, state.fome - delta * RUN_FOME_EXTRA_PER_SEC);
    let nx = player.position.x + moveDir.x * speed;
    let nz = player.position.z + moveDir.z * speed;
    let blockedX = false, blockedZ = false;

    if (currentArea === "town") {
      for (const b of buildingsData) {
        if (rectHitTown(nx, player.position.z, b)) blockedX = true;
        if (rectHitTown(player.position.x, nz, b)) blockedZ = true;
      }
      for (const b of decorativeBuildings) {
        if (rectHitTown(nx, player.position.z, b)) blockedX = true;
        if (rectHitTown(player.position.x, nz, b)) blockedZ = true;
      }
      for (const p of pedestrians) {
        if (Math.hypot(nx - p.mesh.position.x, player.position.z - p.mesh.position.z) < 1.3) blockedX = true;
        if (Math.hypot(player.position.x - p.mesh.position.x, nz - p.mesh.position.z) < 1.3) blockedZ = true;
      }
      nx = THREE.MathUtils.clamp(nx, -60, 60);
      nz = THREE.MathUtils.clamp(nz, -60, 60);
    } else {
      const def = interiorDefs[currentArea];
      const ax = def.anchor.x, az = def.anchor.z;
      for (const o of def.obstacles) {
        const ow = o.w/2 + 0.85, od = o.d/2 + 0.85;
        const ox = ax + o.x, oz = az + o.z;
        if (Math.abs(nx - ox) < ow && Math.abs(player.position.z - oz) < od) blockedX = true;
        if (Math.abs(player.position.x - ox) < ow && Math.abs(nz - oz) < od) blockedZ = true;
      }
      nx = THREE.MathUtils.clamp(nx, ax - def.w/2 + 0.8, ax + def.w/2 - 0.8);
      nz = THREE.MathUtils.clamp(nz, az - def.d/2 + 0.8, az + def.d/2 - 0.8);
    }
    if (!blockedX) player.position.x = nx;
    if (!blockedZ) player.position.z = nz;
    player.rotation.y = Math.atan2(moveDir.x, moveDir.z);

    if (playerKnockElapsed < KNOCKDOWN_DURATION) {
      playerWalkPhase = 0; playerVisual.position.y = 0;
    } else {
      playerWalkPhase += delta * 11;
      playerVisual.position.y = Math.abs(Math.sin(playerWalkPhase)) * 0.4;
    }
  } else {
    playerWalkPhase = 0;
    if (playerKnockElapsed >= KNOCKDOWN_DURATION) playerVisual.position.y = 0;
  }

  if (playerKnockElapsed < KNOCKDOWN_DURATION) {
    playerKnockElapsed += delta;
    playerVisual.rotation.x = knockdownAngle(playerKnockElapsed, KNOCKDOWN_DURATION);
  } else if (playerVisual.rotation.x !== 0) {
    playerVisual.rotation.x = 0;
  }

  nearBuilding = null; nearHotspot = null; nearPedestrian = null;
  const promptEl = document.getElementById("prompt");

  if (currentArea === "town") {
    for (const b of buildingsData) {
      if (b.locked && !buildingUnlocked(b.id)) continue;
      const doorZ = b.z + b.d/2 + 1.2;
      const distToDoor = Math.hypot(player.position.x - b.x, player.position.z - doorZ);
      if (distToDoor < 3.2) { nearBuilding = b; break; }
    }
    if (!nearBuilding) {
      for (const p of pedestrians) {
        if (Math.hypot(player.position.x - p.mesh.position.x, player.position.z - p.mesh.position.z) < 2.3) { nearPedestrian = p; break; }
      }
    }
    promptEl.style.display = (nearBuilding || nearPedestrian) ? "block" : "none";
    promptEl.textContent = nearBuilding ? "Pressione E para entrar" : (nearPedestrian ? "Pressione E para conversar" : "");
  } else {
    const def = interiorDefs[currentArea];
    const ax = def.anchor.x, az = def.anchor.z;
    for (const h of def.hotspots) {
      const hx = ax + h.x, hz = az + h.z;
      if (Math.hypot(player.position.x - hx, player.position.z - hz) < h.r) { nearHotspot = h; break; }
    }
    if (!nearHotspot) {
      const ex = ax + def.exitLocal.x, ez = az + def.exitLocal.z;
      if (Math.hypot(player.position.x - ex, player.position.z - ez) < def.exitR) {
        nearHotspot = { id: "exit", label: "sair", action: "exit" };
      }
    }
    promptEl.style.display = nearHotspot ? "block" : "none";
    if (nearHotspot) promptEl.textContent = nearHotspot.action === "exit" ? "Pressione E para sair" : `Pressione E para ${nearHotspot.label}`;
  }

  if (keys["e"] && !eKeyLatched) {
    eKeyLatched = true;
    tryInteract();
  }
}
function tryInteract() {
  if (modalOpen || minigameMode) return;
  if (currentArea === "town" && nearBuilding) enterInterior(nearBuilding.id);
  else if (currentArea === "town" && nearPedestrian) talkToPedestrian(nearPedestrian);
  else if (currentArea !== "town" && nearHotspot) handleHotspot(nearHotspot);
}

function enterInterior(id) {
  currentArea = id;
  const def = interiorDefs[id];
  player.position.set(def.anchor.x + def.entryLocal.x, 0, def.anchor.z + def.entryLocal.z);
  player.rotation.y = Math.PI;
  document.getElementById("areaTag").style.display = "block";
  document.getElementById("areaTagText").textContent = def.label;
  toast("Você entrou: " + def.label, 1600);
}
function exitInterior() {
  const bd = findBuilding(currentArea);
  currentArea = "town";
  player.position.set(bd.x, 0, bd.z + bd.d/2 + 2.6);
  player.rotation.y = 0;
  document.getElementById("areaTag").style.display = "none";
}
function isNightTime() {
  return timeOfDay >= 21 || timeOfDay < 5;
}
function handleHotspot(h) {
  if (h.action === "exit") return exitInterior();
  if (h.action === "sleep") {
    if (!isNightTime()) { toast("😴 Só dá pra dormir à noite. Volte mais tarde!"); return; }
    return sleepAndAdvance();
  }
  if (h.action === "computer") return openComputer();
  if (h.action === "work") return tryStartWork(currentArea);
  if (h.action === "market") return openMarket();
  if (h.action === "hospital") return healAtHospital();
  if (h.action === "nurse") return tryStartNurseJob();
}

let timeOfDay = 7;
const DAY_LENGTH_SECONDS = 300;
const SKY_NIGHT = new THREE.Color(0x0b1030);
const SKY_DAWN = new THREE.Color(0xffa15c);
const SKY_DAY = new THREE.Color(0x8fd0f0);
let hudTimeCounter = 0;

function updateDayNight(delta) {
  timeOfDay += (delta / DAY_LENGTH_SECONDS) * 24;
  if (timeOfDay >= 24) timeOfDay -= 24;
  let c, sunIntensity, ambIntensity;
  if (timeOfDay >= 5 && timeOfDay < 7) {
    const t = (timeOfDay - 5) / 2; c = SKY_NIGHT.clone().lerp(SKY_DAWN, t); sunIntensity = 0.25+t*0.55; ambIntensity = 0.3+t*0.3;
  } else if (timeOfDay >= 7 && timeOfDay < 17) {
    const t = Math.min(1,(timeOfDay - 7)/2); c = SKY_DAWN.clone().lerp(SKY_DAY, t); sunIntensity = 0.9; ambIntensity = 0.7;
  } else if (timeOfDay >= 17 && timeOfDay < 19) {
    const t = (timeOfDay - 17)/2; c = SKY_DAY.clone().lerp(SKY_DAWN, t); sunIntensity = 0.9-t*0.5; ambIntensity = 0.7-t*0.3;
  } else if (timeOfDay >= 19 && timeOfDay < 21) {
    const t = (timeOfDay - 19)/2; c = SKY_DAWN.clone().lerp(SKY_NIGHT, t); sunIntensity = 0.4-t*0.32; ambIntensity = 0.4-t*0.22;
  } else {
    c = SKY_NIGHT; sunIntensity = 0.08; ambIntensity = 0.18;
  }
  scene.background.copy(c);
  scene.fog.color.copy(c);
  sun.intensity = sunIntensity;
  ambientLight.intensity = ambIntensity;
  const angle = (timeOfDay / 24) * Math.PI * 2;
  sun.position.set(Math.cos(angle) * 60, Math.max(6, Math.sin(angle) * 60), 20);

  hudTimeCounter += delta;
  if (hudTimeCounter > 0.5) {
    hudTimeCounter = 0;
    const h = Math.floor(timeOfDay); const m = Math.floor((timeOfDay - h) * 60);
    document.getElementById("hudTime").textContent = String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0");
  }

  updateSurvivalStats(delta);
}

const FOME_DECAY_PER_SEC = 100 / 600; // esvazia em ~2 dias de jogo
const SAUDE_DECAY_PER_SEC = 100 / 90; // com fome zerada, perde a vida em ~90s
function updateSurvivalStats(delta) {
  if (modalOpen || minigameMode) return;
  state.fome = Math.max(0, state.fome - delta * FOME_DECAY_PER_SEC);
  if (state.fome <= 0) {
    state.saude = Math.max(0, state.saude - delta * SAUDE_DECAY_PER_SEC);
  }
  refreshHUD();
  if (state.saude <= 0) faintFromHunger();
}
function faintFromHunger() {
  if (currentArea !== "town") exitInterior();
  const home = findBuilding("home");
  currentArea = "town";
  player.position.set(home.x, 0, home.z + home.d/2 + 2.6);
  state.saude = 50; state.fome = 35;
  state.day += 1; state.workCount = 0; state.nurseWorkCount = 0;
  timeOfDay = 7;
  refreshHUD();
  openModal(`<h2>😵 Você desmaiou de fome!</h2><p>Alguém te levou pra casa. Acordou com a vida e a fome parcialmente recuperadas, mas perdeu o dia de hoje.</p><p class="note">Coma no Mercadinho pra evitar isso!</p>`);
}

const clock = new THREE.Clock();
let gameErrorLogged = false;
function animate() {
  requestAnimationFrame(animate);
  try {
    const delta = Math.min(clock.getDelta(), 0.05);
    if (introActive) { updateIntro(delta); return; }
    updatePlayer(delta);
    updateDayNight(delta);
    if (currentArea === "town" && !modalOpen && !minigameMode) { updatePedestrians(delta); updateCars(delta); updateCarCollisions(delta); }

    updateCameras();
    renderer.render(scene, activeCamera);
  } catch (err) {
    if (!gameErrorLogged) {
      gameErrorLogged = true;
      console.error("Erro no loop do jogo (reportado uma única vez):", err);

  }
}

/* ================= CONTROLES DE TOQUE (celular) ================= */
const activeTouches = {};
const joystickBase = document.getElementById("joystickBase");
const joystickThumb = document.getElementById("joystickThumb");
const JOY_MAX = 42;

function touchZoneFor(clientX) {
  const rect = wrap.getBoundingClientRect();
  return (clientX - rect.left) < rect.width / 2 ? "move" : "look";
}
wrap.addEventListener("touchstart", (ev) => {
  if (modalOpen || minigameMode || introActive) return;
  for (const t of ev.changedTouches) {
    const rect = wrap.getBoundingClientRect();
    const zone = touchZoneFor(t.clientX);
    activeTouches[t.identifier] = { zone, startX: t.clientX, startY: t.clientY, lastX: t.clientX, lastY: t.clientY };
    if (zone === "move") {
      joystickBase.style.left = (t.clientX - rect.left) + "px";
      joystickBase.style.top = (t.clientY - rect.top) + "px";
      joystickBase.style.display = "block";
      joystickThumb.style.transform = "translate(-50%,-50%)";
    }
  }
}, { passive: true });
wrap.addEventListener("touchmove", (ev) => {
  for (const t of ev.changedTouches) {
    const info = activeTouches[t.identifier];
    if (!info) continue;
    if (info.zone === "move") {
      let dx = t.clientX - info.startX, dy = t.clientY - info.startY;
      const len = Math.hypot(dx, dy);
      if (len > JOY_MAX) { dx = dx / len * JOY_MAX; dy = dy / len * JOY_MAX; }
      joystickVec.x = dx / JOY_MAX;
      joystickVec.y = dy / JOY_MAX;
      joystickThumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    } else {
      const ddx = t.clientX - info.lastX, ddy = t.clientY - info.lastY;
      info.lastX = t.clientX; info.lastY = t.clientY;
      cameraYaw -= ddx * 0.006;
      cameraPitch = THREE.MathUtils.clamp(cameraPitch - ddy * 0.006, -0.6, 0.6);
    }
  }
}, { passive: true });
function endTouch(ev) {
  for (const t of ev.changedTouches) {
    const info = activeTouches[t.identifier];
    if (!info) continue;
    if (info.zone === "move") {
      joystickVec.x = 0; joystickVec.y = 0;
      joystickBase.style.display = "none";
    }
    delete activeTouches[t.identifier];
  }
}
wrap.addEventListener("touchend", endTouch, { passive: true });
wrap.addEventListener("touchcancel", endTouch, { passive: true });

function sleepAndAdvance() {
  state.day += 1; state.workCount = 0; state.nurseWorkCount = 0;
  timeOfDay = 6.5;
  toast("Um novo dia começou ☀️");
}

function tryStartWork(buildingId) {
  const job = jobTiers[state.jobTier];
  if (job.building !== buildingId) { toast("Seu cargo atual não trabalha aqui."); return; }
  if (state.workCount >= 2) { toast("Você já trabalhou 2 vezes hoje. Durma para trabalhar de novo."); return; }
  if (buildingId === "lanchonete") startOrderGame3D(buildingId);
  else startEmployeeGame3D(buildingId);
}

function finishShift(performance) {
  const job = jobTiers[state.jobTier];
  const bonus = Math.round(job.pay * (performance/100));
  const earned = Math.round(job.pay * 0.5) + bonus;
  state.money += earned;
  state.daysAtJob += 1;
  state.workCount += 1;
  const baseGain = Math.round((performance/100) * 6) + 2;
  const gain = Math.round(baseGain * (1 + state.studyBonus / 100));
  state.skills[job.skill] += gain;
  refreshHUD();
  checkPromotion();
  openModal(`
    <h2>Turno concluído!</h2>
    <p>Desempenho: <b>${performance}%</b></p>
    <p>Você ganhou <b>R$${earned}</b></p>
    <p>XP ganho: <b>+${gain} ${job.skill}</b>${state.studyBonus > 0 ? ` <span class="note">(bônus de estudo: +${state.studyBonus}%)</span>` : ""}</p>
    <p class="note">Você pode trabalhar mais ${Math.max(0, 2 - state.workCount)}x hoje neste emprego, ou dormir pra avançar o dia.</p>
  `);
}

function checkPromotion() {
  const job = jobTiers[state.jobTier];
  const req = job.req;
  if (!req) return;
  const meetsSkills = Object.keys(req).every(k => {
    if (k === "days") return state.daysAtJob >= req.days;
    return state.skills[k] >= req[k];
  });
  if (meetsSkills) {
    state.jobTier += 1;
    state.daysAtJob = 0;
    const newTitle = jobTiers[state.jobTier].title;
    refreshLockedVisuals();
    setTimeout(() => toast("🎉 PROMOÇÃO! Agora você é " + newTitle, 4000), 400);
    if (state.jobTier === jobTiers.length - 1) {
      setTimeout(() => openModal(`
        <h2>🏆 VOCÊ VENCEU!</h2>
        <p>Você fundou sua própria empresa: <b>Robotics Valley</b>!</p>
        <p>Obrigado por jogar Pine Valley!</p>
      `), 4600);
    }
  }
}

/* ---------- COMPUTADOR / CURSOS / QUIZ ---------- */
function openComputer() {
  const list = COURSES.map((c,i) => `
    <div class="item"><b>${c.name}</b> — R$${c.cost} (${c.skill})
      <div><button ${state.money < c.cost ? "disabled" : ""} data-action="startCourse" data-arg="${i}">Comprar e estudar</button></div>
    </div>`).join("");
  openModal(`<h2>💻 Computador</h2><p class="note">Compre cursos online e responda o quiz pra aprender de verdade. Bônus de XP atual nos empregos: <b>+${state.studyBonus}%</b></p>${list}`);
}
function startCourse(i) {
  const c = COURSES[i];
  if (state.money < c.cost) return;
  state.money -= c.cost;
  refreshHUD();
  const bank = QUIZ_BANKS[c.skill];
  const questions = [...bank].sort(() => Math.random() - 0.5).slice(0, 5);
  quizState = { skill: c.skill, questions, index: 0, correctCount: 0 };
  renderQuizQuestion();
}
function renderQuizQuestion() {
  const q = quizState.questions[quizState.index];
  const optsHtml = q.opts.map((o,i) => `<div><button data-action="answerQuiz" data-arg="${i}">${o}</button></div>`).join("");
  openModal(`<h2>🧠 Pergunta ${quizState.index+1}/${quizState.questions.length}</h2><p>${q.q}</p>${optsHtml}`);
}
function answerQuiz(i) {
  const q = quizState.questions[quizState.index];
  if (i === q.correct) {
    quizState.correctCount += 1;
    state.skills[quizState.skill] += 6;
    state.studyBonus = Math.min(50, state.studyBonus + 1);
    toast("✅ Correto! +6 " + quizState.skill + " · bônus de XP: +" + state.studyBonus + "%");
  } else {
    toast("❌ Não era essa...");
  }
  quizState.index += 1;
  refreshHUD();
  checkPromotion();
  if (quizState.index >= quizState.questions.length) {
    openModal(`<h2>📚 Curso concluído!</h2><p>Você acertou ${quizState.correctCount}/${quizState.questions.length} perguntas.</p><p class="note">Seu bônus de XP nos empregos agora é <b>+${state.studyBonus}%</b>.</p>`);
    quizState = null;
  } else {
    renderQuizQuestion();
  }
}

/* ---------- MINIGAME LANCHONETE: janela + montagem de sanduíche ---------- */
const QUEUE_SIZE = 3;
const WINDOW_SLOTS = [ { x: -2.3, y: 2.35, z: -4.6 }, { x: 0, y: 2.35, z: -4.6 }, { x: 2.3, y: 2.35, z: -4.6 } ];

function startOrderGame3D(buildingId) {
  const ig = interiorGroups[buildingId];
  const def = ig.def;
  enterMinigame({ x: def.anchor.x, y: 3.6, z: def.anchor.z - 2.6 }, 22);
  orderState = {
    buildingId, ig,
    queue: [], totalSpawned: 0, totalToServe: 5, served: 0, scoreSum: 0,
    input: [], stackMeshes: [], buttons: [], timer: null, timeLeft: 0,
  };
  const row1 = INGREDIENTS.slice(0, 4);
  const row2 = INGREDIENTS.slice(4);
  row1.forEach((ing, i) => {
    const sp = makeTextSprite(ing.emoji, { fontsize: 110, scale: 3.4, bg: "rgba(255,255,255,0.22)" });
    sp.position.set((i - (row1.length - 1) / 2) * 4.4, 5.6, -2.6);
    sp.userData.key = ing.key;
    ig.minigameGroup.add(sp);
    orderState.buttons.push(sp);
  });
  row2.forEach((ing, i) => {
    const sp = makeTextSprite(ing.emoji, { fontsize: 110, scale: 3.4, bg: "rgba(255,255,255,0.22)" });
    sp.position.set((i - (row2.length - 1) / 2) * 4.4, 1.6, -2.6);
    sp.userData.key = ing.key;
    ig.minigameGroup.add(sp);
    orderState.buttons.push(sp);
  });
  clickHandler = (ray) => {
    const hit = ray.intersectObjects(orderState.buttons)[0];
    if (hit) ingredientClick(hit.object.userData.key);
  };
  for (let i = 0; i < QUEUE_SIZE; i++) spawnNextCustomer();
  renderOrderHud();
}
function spawnNextCustomer() {
  if (orderState.queue.length >= QUEUE_SIZE) return;
  if (orderState.totalSpawned >= orderState.totalToServe) return;
  orderState.totalSpawned += 1;
  const recipe = RECIPES[Math.floor(Math.random() * RECIPES.length)];
  const slotIndex = orderState.queue.length;
  const slot = WINDOW_SLOTS[slotIndex];
  const g = createPersonBust(0xf2c49b, 0x4a3324, 0x66aacc);
  g.position.set(slot.x, slot.y, slot.z);
  g.scale.set(0.5, 0.5, 0.5);
  orderState.ig.minigameGroup.add(g);
  orderState.queue.push({ mesh: g, recipe, sequence: recipe.seq, state: "poppingIn", t: 0, duration: 0.35, slotIndex });
}
function onCustomerArrivedFront() { startServiceTimer(); renderOrderHud(); }
function startServiceTimer() {
  clearInterval(orderState.timer);
  orderState.timeLeft = Math.max(24, 32 - state.jobTier * 2);
  orderState.input = [];
  clearStackMeshes();
  orderState.timer = setInterval(() => {
    try {
      orderState.timeLeft -= 1;
      if (orderState.timeLeft <= 0) { clearInterval(orderState.timer); deliverCurrentOrder(); }
      else renderOrderHud();
    } catch (err) { clearInterval(orderState.timer); console.error("Erro no cronômetro:", err); }
  }, 1000);
}
function updateOrderAnim(delta) {
  for (const c of orderState.queue) {
    if (c.state === "poppingIn" || c.state === "poppingOut") {
      c.t += delta / c.duration;
      const t = Math.min(1, c.t);
      const s = c.state === "poppingIn" ? 0.5 + 0.5*t : 1 - 0.9*t;
      c.mesh.scale.set(s,s,s);
      setGroupOpacity(c.mesh, c.state === "poppingIn" ? t : 1 - t);
      if (t >= 1) {
        if (c.state === "poppingOut") { orderState.ig.minigameGroup.remove(c.mesh); c._removed = true; }
        else { c.state = "idle"; if (c.slotIndex === 0) onCustomerArrivedFront(); }
      }
    }
  }
  if (orderState.queue.some(c => c._removed)) {
    orderState.queue = orderState.queue.filter(c => !c._removed);
    advanceQueuePositions();
  }
}
function advanceQueuePositions() {
  orderState.queue.forEach((c, idx) => {
    if (c.slotIndex !== idx) {
      c.slotIndex = idx;
      const slot = WINDOW_SLOTS[idx];
      c.mesh.position.set(slot.x, slot.y, slot.z);
      if (idx === 0 && c.state === "idle") onCustomerArrivedFront();
    }
  });
  spawnNextCustomer();
  if (orderState.queue.length === 0 && orderState.totalSpawned >= orderState.totalToServe) {
    const perf = Math.round(orderState.scoreSum / orderState.totalToServe);
    const ig = orderState.ig;
    exitMinigame(ig.minigameGroup);
    orderState = null;
    finishShift(perf);
  } else {
    renderOrderHud();
  }
}
function clearStackMeshes() {
  orderState.stackMeshes.forEach(m => orderState.ig.minigameGroup.remove(m));
  orderState.stackMeshes = [];
}
function addStackLayer(key) {
  const ing = INGREDIENTS.find(i => i.key === key);
  const h = 0.32;
  const layer = boxMesh(1.5, h, 1.5, ing.color);
  layer.position.set(0, h/2 + orderState.stackMeshes.length * h, -0.6);
  orderState.ig.minigameGroup.add(layer);
  orderState.stackMeshes.push(layer);
}
function renderOrderHud() {
  const front = orderState.queue[0];
  const servedTxt = `Atendidos: ${orderState.served}/${orderState.totalToServe}`;
  if (!front || front.state !== "idle") {
    document.getElementById("stageHud").innerHTML = `
      <div><b>🍔 Lanchonete</b> — ${servedTxt}</div>
      <div class="note">Aguardando cliente aparecer na janela... (${orderState.queue.length} na fila)</div>`;
    return;
  }
  const seq = front.sequence.map(k => INGREDIENTS.find(x => x.key === k).emoji).join(" ");
  const montado = orderState.input.length ? orderState.input.map(k => INGREDIENTS.find(x => x.key === k).emoji).join(" ") : "—";
  document.getElementById("stageHud").innerHTML = `
    <div><b>🍔 ${servedTxt}</b> — pedido: ${front.recipe.name} · fila: ${orderState.queue.length}</div>
    <div class="seq">${seq}</div>
    <div class="note">Montado até agora: ${montado}</div>
    <div class="note">Tempo: ${orderState.timeLeft}s</div>
    <button class="stageBtn" data-action="discardCurrentOrder">🗑️ Descartar e recomeçar</button>`;
}
function ingredientClick(key) {
  const front = orderState.queue[0];
  if (!front || front.state !== "idle") return;
  orderState.input.push(key);
  addStackLayer(key);
  if (orderState.input.length >= front.sequence.length) deliverCurrentOrder();
  else renderOrderHud();
}
function discardCurrentOrder() { orderState.input = []; clearStackMeshes(); renderOrderHud(); }
function deliverCurrentOrder() {
  clearInterval(orderState.timer);
  const front = orderState.queue[0];
  let orderScore = 0;
  if (front) {
    const seq = front.sequence;
    let matches = 0;
    for (let i = 0; i < seq.length; i++) if (orderState.input[i] === seq[i]) matches++;
    const accuracy = Math.round((matches / seq.length) * 100);
    orderScore = accuracy;
    if (accuracy === 100) orderScore = Math.min(100, orderScore + Math.min(20, Math.round((orderState.timeLeft/32)*20)));
    const line = accuracy === 100 ? generateCustomerLine("praise")
      : accuracy >= 50 ? generateCustomerLine("meh")
      : generateCustomerLine("angry");
    say("Cliente", line, { pitch: 1.15, rate: 1.05 });
    front.state = "poppingOut"; front.t = 0; front.duration = 0.3;
  }
  orderState.scoreSum += orderScore;
  orderState.served += 1;
  orderState.input = [];
  clearStackMeshes();
  renderOrderHud();
}

/* ---------- MINIGAME BICO: ENFERMEIRO NO HOSPITAL ---------- */
const NURSE_PAY_BASE = 60;
const PATIENT_CASES = [
  { symptom: "Febre alta 🤒", options: [ { label: "Dar remédio pra febre", correct: true }, { label: "Colocar gesso", correct: false }, { label: "Ignorar e mandar embora", correct: false } ] },
  { symptom: "Braço quebrado 🦴", options: [ { label: "Colocar gesso", correct: true }, { label: "Dar xarope", correct: false }, { label: "Aplicar band-aid", correct: false } ] },
  { symptom: "Corte no dedo 🩹", options: [ { label: "Limpar e enfaixar", correct: true }, { label: "Fazer cirurgia", correct: false }, { label: "Dar remédio pra febre", correct: false } ] },
  { symptom: "Dor de garganta 🤧", options: [ { label: "Dar xarope", correct: true }, { label: "Colocar gesso", correct: false }, { label: "Aplicar band-aid", correct: false } ] },
  { symptom: "Tontura e fraqueza 😵", options: [ { label: "Medir pressão e dar água", correct: true }, { label: "Fazer cirurgia", correct: false }, { label: "Colocar gesso", correct: false } ] },
  { symptom: "Alergia na pele 🌡️", options: [ { label: "Dar pomada antialérgica", correct: true }, { label: "Aplicar band-aid", correct: false }, { label: "Dar xarope", correct: false } ] },
];
function tryStartNurseJob() {
  if (state.nurseWorkCount >= 2) { toast("Você já atendeu pacientes 2 vezes hoje. Volte amanhã!"); return; }
  startNurseGame3D();
}
function startNurseGame3D() {
  const ig = interiorGroups["hospital"];
  const def = ig.def;
  enterMinigame({ x: def.anchor.x - 4.5, z: def.anchor.z + 0.5 }, 11);
  const chosen = [...PATIENT_CASES].sort(() => Math.random() - 0.5).slice(0, 4);
  nurseState = { cases: chosen, index: 0, score: 0, podiums: [], patientMesh: null, ig };
  renderNurseScene();
}
function renderNurseScene() {
  const ig = nurseState.ig;
  nurseState.podiums.forEach(p => ig.minigameGroup.remove(p.group));
  nurseState.podiums = [];
  if (nurseState.patientMesh) { ig.minigameGroup.remove(nurseState.patientMesh); nurseState.patientMesh = null; }

  const c = nurseState.cases[nurseState.index];
  const pat = createPersonBust(0xf2c49b, 0x33291f, 0xffffff);
  pat.position.set(-4.5, 2.0, 1.0);
  setGroupOpacity(pat, 1);
  ig.minigameGroup.add(pat);
  nurseState.patientMesh = pat;
  say("Paciente", `Estou com: ${c.symptom}`, { pitch: 1.2, rate: 1.0 });

  const opts = [...c.options].sort(() => Math.random() - 0.5);
  opts.forEach((o, i) => {
    const g = new THREE.Group();
    const podium = boxMesh(2.0, 1.6, 2.0, 0x66bbaa);
    podium.position.y = 0.8; g.add(podium);
    const lbl = makeTextSprite(o.label, { fontsize: 24, scale: 1.5, bg: "rgba(20,40,30,0.9)" });
    lbl.position.y = 2.0; g.add(lbl);
    g.position.set(-4.5 + (i - 1) * 3.6, 0, -1.6);
    g.userData.correct = o.correct;
    ig.minigameGroup.add(g);
    nurseState.podiums.push({ group: g });
  });
  clickHandler = (ray) => {
    const objs = nurseState.podiums.map(p => p.group.children).flat();
    const hit = ray.intersectObjects(objs)[0];
    if (hit) {
      let obj = hit.object;
      while (obj.parent && obj.userData.correct === undefined) obj = obj.parent;
      if (obj.userData.correct !== undefined) nursePick(obj.userData.correct);
    }
  };
  document.getElementById("stageHud").innerHTML = `
    <div><b>💉 Paciente ${nurseState.index + 1}/${nurseState.cases.length}</b></div>
    <div>${c.symptom}</div>
    <div class="note">Escolha o tratamento certo no pódio</div>`;
}
function nursePick(correct) {
  nurseState.score += correct ? 100 : 0;
  nurseState.index += 1;
  if (nurseState.index >= nurseState.cases.length) {
    const ig = nurseState.ig;
    const performance = Math.round(nurseState.score / nurseState.cases.length);
    nurseState.podiums.forEach(p => ig.minigameGroup.remove(p.group));
    if (nurseState.patientMesh) ig.minigameGroup.remove(nurseState.patientMesh);
    exitMinigame(ig.minigameGroup);
    finishNurseShift(performance);
    nurseState = null;
  } else {
    renderNurseScene();
  }
}
function finishNurseShift(performance) {
  const pay = Math.round(NURSE_PAY_BASE * (performance / 100));
  state.money += pay;
  state.nurseWorkCount += 1;
  refreshHUD();
  openModal(`<h2>💉 Plantão de enfermagem concluído!</h2><p>Desempenho: <b>${performance}%</b></p><p>Você ganhou <b>R$${pay}</b></p><p class="note">Isso é um bico extra — não interfere no seu emprego principal.</p>`);
}

function startEmployeeGame3D(buildingId) {
  const ig = interiorGroups[buildingId];
  const def = ig.def;
  enterMinigame({ x: def.anchor.x, z: def.anchor.z - 1.6 }, 12);
  const pool = EMPLOYEE_SCENARIOS[buildingId];
  const chosen = [...pool].sort(() => Math.random() - 0.5).slice(0, 3).map(sc => ({
    ...sc,
    employee: `${pick(EMPLOYEE_NAMES[buildingId])}, ${sc.role}`,
  }));
  decisionState = { scenarios: chosen, index: 0, score: 0, podiums: [], employeeMesh: null, buildingId, ig };
  renderEmployeeScene();
}
function renderEmployeeScene() {
  const ig = decisionState.ig;
  decisionState.podiums.forEach(p => ig.minigameGroup.remove(p.group));
  decisionState.podiums = [];
  if (decisionState.employeeMesh) { ig.minigameGroup.remove(decisionState.employeeMesh); decisionState.employeeMesh = null; }

  const sc = decisionState.scenarios[decisionState.index];
  const emp = createPersonBust(0xf2c49b, 0x33291f, 0x88aacc);
  emp.position.set(0, 2.35, -4.6);
  setGroupOpacity(emp, 1);
  ig.minigameGroup.add(emp);
  decisionState.employeeMesh = emp;
  say(sc.employee, sc.line, { pitch: 0.85, rate: 0.95 });

  sc.options.forEach((o, i) => {
    const g = new THREE.Group();
    const podium = boxMesh(2.2,1.8,2.2, 0x8888cc);
    podium.position.y = 0.9; g.add(podium);
    const lbl = makeTextSprite(o.label, { fontsize: 26, scale: 1.7, bg: "rgba(20,20,40,0.9)" });
    lbl.position.y = 2.2; g.add(lbl);
    g.position.set((i - 1) * 4.4, 0, -1.2);
    g.userData.optionIndex = i;
    ig.minigameGroup.add(g);
    decisionState.podiums.push({ group: g, index: i });
  });
  clickHandler = (ray) => {
    const objs = decisionState.podiums.map(p => p.group.children).flat();
    const hit = ray.intersectObjects(objs)[0];
    if (hit) {
      let obj = hit.object;
      while (obj.parent && obj.userData.optionIndex === undefined) obj = obj.parent;
      if (obj.userData.optionIndex !== undefined) employeePick(obj.userData.optionIndex);
    }
  };
  document.getElementById("stageHud").innerHTML = `
    <div><b>👔 Funcionário ${decisionState.index+1}/${decisionState.scenarios.length}</b> — ${sc.employee}</div>
    <div class="note">Escolha sua resposta clicando no pódio</div>`;
}
function employeePick(i) {
  const sc = decisionState.scenarios[decisionState.index];
  decisionState.score += sc.options[i].score;
  decisionState.index += 1;
  if (decisionState.index >= decisionState.scenarios.length) {
    const ig = decisionState.ig;
    const performance = Math.round(decisionState.score / decisionState.scenarios.length);
    decisionState.podiums.forEach(p => ig.minigameGroup.remove(p.group));
    if (decisionState.employeeMesh) ig.minigameGroup.remove(decisionState.employeeMesh);
    exitMinigame(ig.minigameGroup);
    decisionState = null;
    finishShift(performance);
  } else {
    renderEmployeeScene();
  }
}

function askPlayerName() {
  openModal(`
    <h2>👤 Seu nome de jogador</h2>
    <p class="note">Esse nome é como outros jogadores vão te encontrar. Escolha um nome único!</p>
    <input id="nameInput" type="text" maxlength="16" placeholder="Digite seu nome"
      style="width:100%;padding:8px;font-family:inherit;font-size:14px;margin-bottom:8px;background:#111;color:#fff;border:1px solid #555;" />
    <button data-action="confirmName">Confirmar</button>
  `);
}
function confirmPlayerName() {
  const input = document.getElementById("nameInput");
  const name = ((input && input.value) || "").trim().slice(0, 16);
  if (!name) { toast("Digite um nome válido."); return; }
  myPlayerName = name;
  try { localStorage.setItem("pineValleyName", name); } catch (err) { /* sem suporte a localStorage, sem problema */ }
  closeModal();
  registerPresence();
  toast(`Bem-vindo, ${name}!`);
}
function registerPresence() {
  if (!fbDb || !myPlayerName) return;
  try {
    presenceRef = fbDb.ref("players/" + myPlayerName);
    presenceRef.onDisconnect().remove();
    updatePresence();
    clearInterval(presenceInterval);
    presenceInterval = setInterval(updatePresence, 2000);
    setupPlayersListener();
  } catch (err) { console.error("Erro ao registrar presença:", err); }
}
function updatePresence() {
  if (!presenceRef) return;
  try {
    presenceRef.set({ x: player.position.x, z: player.position.z, area: currentArea, ts: Date.now() })
      .catch(err => console.error("Erro ao atualizar presença:", err));
  } catch (err) { console.error("Erro ao atualizar presença:", err); }
}

function setupPlayersListener() {
  if (!fbDb) return;
  try {
    fbDb.ref("players").on("value", (snap) => {
      const data = snap.val() || {};
      const now = Date.now();
      Object.keys(data).forEach(name => {
        if (name === myPlayerName) return;
        const d = data[name];
        if (!d || now - (d.ts || 0) > 10000 || d.area !== currentArea) { removeRemotePlayer(name); return; }
        if (!remotePlayers[name]) {
          remotePlayers[name] = createRemotePlayerMesh(name);
          scene.add(remotePlayers[name].group);
        }
        remotePlayers[name].group.position.set(d.x, 0, d.z);
      });
      Object.keys(remotePlayers).forEach(name => { if (!data[name]) removeRemotePlayer(name); });
    });
  } catch (err) { console.error("Erro ao escutar jogadores:", err); }
}
function createRemotePlayerMesh(name) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,1.5,12), new THREE.MeshLambertMaterial({ color: 0x66ddaa }));
  body.position.y = 0.9; group.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.4,12,12), new THREE.MeshLambertMaterial({ color: 0xf2c49b }));
  head.position.y = 1.85; group.add(head);
  const label = makeTextSprite(name, { fontsize: 34, scale: 1.6, bg: "rgba(20,120,100,0.75)" });
  label.position.y = 2.6; group.add(label);
  return { group };
}
function removeRemotePlayer(name) {
  if (remotePlayers[name]) { scene.remove(remotePlayers[name].group); delete remotePlayers[name]; }
}

function openFriendSearch() {
  openModal(`
    <h2>👥 Amigos</h2>
    <input id="friendSearchInput" type="text" maxlength="16" placeholder="Nome do jogador"
      style="width:100%;padding:8px;font-family:inherit;font-size:14px;margin-bottom:8px;background:#111;color:#fff;border:1px solid #555;" />
    <button data-action="searchFriend">Buscar</button>
    <div id="friendSearchResult" style="margin-top:10px;"></div>
    <div style="margin-top:14px;"><b>Seus amigos:</b></div>
    <div id="friendListArea" class="note">Carregando...</div>
  `);
  renderFriendList();
}
function searchFriend() {
  if (!fbDb) { toast("Conexão com o servidor de amigos indisponível."); return; }
  const input = document.getElementById("friendSearchInput");
  const name = ((input && input.value) || "").trim();
  if (!name) return;
  fbDb.ref("players/" + name).once("value").then(snap => {
    const el = document.getElementById("friendSearchResult");
    if (!el) return;
    if (!snap.exists()) { el.innerHTML = `<p class="note">Nenhum jogador online com esse nome agora.</p>`; return; }
    const online = (Date.now() - (snap.val().ts || 0)) < 15000;
    el.innerHTML = `<p>${name} — ${online ? "🟢 online" : "🔴 offline"}</p>
      <button data-action="addFriend" data-arg="${name}">Adicionar como amigo</button>`;
  }).catch(err => { console.error("Erro na busca:", err); toast("Erro ao buscar jogador."); });
}
function addFriend(name) {
  if (!fbDb || !myPlayerName || name === myPlayerName) return;
  fbDb.ref(`friendships/${myPlayerName}/${name}`).set(true)
    .then(() => { toast(`${name} adicionado como amigo!`); renderFriendList(); })
    .catch(err => { console.error(err); toast("Erro ao adicionar amigo."); });
}
function renderFriendList() {
  if (!fbDb || !myPlayerName) return;
  fbDb.ref(`friendships/${myPlayerName}`).once("value").then(async (snap) => {
    const el = document.getElementById("friendListArea");
    if (!el) return;
    if (!snap.exists()) { el.innerHTML = `Nenhum amigo adicionado ainda.`; return; }
    const names = Object.keys(snap.val());
    const rows = [];
    for (const n of names) {
      try {
        const s = await fbDb.ref("players/" + n).once("value");
        const online = s.exists() && (Date.now() - (s.val().ts || 0)) < 15000;
        rows.push(`<div>${n} — ${online ? "🟢 online" : "🔴 offline"}</div>`);
      } catch (err) { rows.push(`<div>${n} — ❓</div>`); }
    }
    el.innerHTML = rows.join("") || "Nenhum amigo adicionado ainda.";
  }).catch(err => console.error("Erro ao carregar amigos:", err));
}
